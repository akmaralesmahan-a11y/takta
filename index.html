<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тақта</title>
  <style>
    body { margin: 0; font-family: Segoe UI, sans-serif; background: #e9e9e4; }
    h1 { font-size: 18px; margin: 0; padding: 10px 14px; background: #f3f3ef; }
    canvas { background: #fff; display: block; width: 100%; touch-action: none; cursor: crosshair; }
    .bar { display: flex; gap: 4px; padding: 6px; background: #f3f3ef; flex-wrap: wrap; }
    button { padding: 8px 14px; border: 1px solid #bbb; background: #fafafa; cursor: pointer; font-size: 15px; }
    button:hover { background: #e4e4e4; }
    button.active { background: #cfe3ff; border-color: #5b9bf5; }
  </style>
</head>
<body>
  <h1>Тақта</h1>
  <canvas id="board" width="1000" height="600"></canvas>
  <div class="bar">
    <button data-color="black" class="active">Қара</button>
    <button data-color="red">Қызыл</button>
    <button data-color="blue">Көк</button>
    <button data-color="eraser">Өшіргіш</button>
    <button id="clear">Тазалау</button>
    <button id="save">Сақтау</button>
  </div>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    let color = "black", drawing = false;

    function pos(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) * canvas.width / r.width,
        y: (e.clientY - r.top) * canvas.height / r.height
      };
    }

    canvas.addEventListener("pointerdown", e => {
      drawing = true;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    });
    canvas.addEventListener("pointermove", e => {
      if (!drawing) return;
      const p = pos(e);
      ctx.strokeStyle = color === "eraser" ? "#fff" : color;
      ctx.lineWidth = color === "eraser" ? 25 : 4;
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    });
    window.addEventListener("pointerup", () => drawing = false);

    document.querySelectorAll("[data-color]").forEach(btn => {
      btn.onclick = () => {
        color = btn.dataset.color;
        document.querySelectorAll("[data-color]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      };
    });

    document.getElementById("clear").onclick = () => {
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };

    document.getElementById("save").onclick = async () => {
      const res = await fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: canvas.toDataURL("image/png") })
      });
      const j = await res.json();
      alert("Сақталды: saved/" + j.file);
    };
  </script>
</body>
</html>
